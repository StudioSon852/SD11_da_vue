# Load .env either from project root or from backend/.env. Values in backend/.env take precedence when both exist.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
spring.application.name=sd11-api
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=never

# For a default SQL Server TCP instance use DB_SERVER + DB_PORT. For SQLEXPRESS/named instances, set DB_JDBC_URL in backend/.env.
spring.datasource.url=${DB_JDBC_URL:jdbc:sqlserver://${DB_SERVER:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:SD_11};encrypt=${DB_ENCRYPT:false};trustServerCertificate=${DB_TRUST_CERT:true};loginTimeout=${DB_LOGIN_TIMEOUT:8}}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# Let the API process start even if SQL Server is currently unreachable, so /api/health can report an actionable diagnosis.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=8000
spring.datasource.hikari.validation-timeout=4000
spring.jackson.time-zone=Asia/Ho_Chi_Minh

app.jwt.secret=${JWT_SECRET:replace_with_a_random_secret_at_least_32_characters_for_local_dev}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:1440}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
app.db.configured-name=${DB_NAME:SD_11}
app.auth.expose-reset-token=${AUTH_EXPOSE_RESET_TOKEN:false}
